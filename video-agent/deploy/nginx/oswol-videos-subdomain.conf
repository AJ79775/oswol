# Standalone site, e.g. videos.oswol.com (set PUBLIC_BASE_URL= empty in /etc/oswol-video/env).
# After DNS points here:  sudo certbot --nginx -d videos.oswol.com
server {
    listen 80;
    listen [::]:80;
    server_name videos.oswol.com;
    root /var/www/oswol-videos;
    index index.html;
    location / { try_files $uri $uri/ =404; add_header Cache-Control "public, max-age=600"; }
    location ~ \.vtt$ { default_type text/vtt; }
    location ~ \.srt$ { default_type application/x-subrip; }
    location = /latest.mp4 { add_header Cache-Control "no-cache"; }
    # auth_basic "Oswol videos";
    # auth_basic_user_file /etc/nginx/.oswol-videos.htpasswd;
}
