# Serve the video library at https://<your-site>/videos/
# Include this inside the existing server { } block for oswol.com, e.g.:
#     include /etc/nginx/snippets/oswol-videos.conf;
# then: sudo nginx -t && sudo systemctl reload nginx
location ~ ^/videos/(.+\.vtt)$ {
    alias /var/www/oswol-videos/$1;
    default_type text/vtt;
}
location ~ ^/videos/(.+\.srt)$ {
    alias /var/www/oswol-videos/$1;
    default_type application/x-subrip;
}
location = /videos/latest.mp4 {
    alias /var/www/oswol-videos/latest.mp4;
    add_header Cache-Control "no-cache";
}
location /videos/ {
    alias /var/www/oswol-videos/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=600";
    # Optional: keep the library private
    # auth_basic "Oswol videos";
    # auth_basic_user_file /etc/nginx/.oswol-videos.htpasswd;
}
